<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PHYSIQUE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PHYSIQUE">
<meta name="theme-color" content="#0A0B0D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
/* PHYSIQUE — dark athletic system. Single deliberate theme. */
:root{
  --bg:#0A0B0D; --panel:#15171B; --panel2:#1D2025; --line:#26292F;
  --text:#F4F5F2; --muted:#83898F; --faint:#4A4F55;
  --volt:#C9F24B; --volt-ink:#141804;
  --amber:#E8B14E; --red:#E8503A; --green:#59C97B;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:calc(130px + env(safe-area-inset-bottom));
  min-height:100vh;
}
main{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.display{font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:26px;margin:8px 0 16px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
h1 .thin{color:var(--muted);font-weight:600}
h2{font-size:12px;font-weight:800;margin:22px 2px 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.05}
.mega{font-size:52px;font-weight:900;letter-spacing:-.04em;line-height:1}
button{font:inherit;color:inherit;border:none;cursor:pointer;border-radius:14px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:14px 16px;font-weight:700;width:100%;text-align:center}
.btn:active{transform:scale(.97)}
.btn-volt{background:var(--volt);color:var(--volt-ink);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-sm{width:auto;padding:9px 14px;font-size:13.5px;font-weight:700}
.chip{display:inline-block;background:var(--panel2);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.chip.volt{color:var(--volt)} .chip.warn{color:var(--red)} .chip.ok{color:var(--green)}
.sessgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sessbtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;text-align:left}
.sessbtn:active{transform:scale(.97)}
.sessbtn b{display:block;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.sessbtn span{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stepper button{background:transparent;padding:12px 13px;font-size:22px;font-weight:800;color:var(--volt);border-radius:0;line-height:1}
.stepper .val{min-width:78px;text-align:center;font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden}
.setrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:none}
.setnum{width:18px;color:var(--faint);font-size:13px;font-weight:900}
.done{background:var(--panel2);border:1px solid var(--line);width:46px;height:46px;border-radius:14px;font-size:18px;flex:none;color:var(--faint)}
.done.on{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.exhead b{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.lastline{font-size:13px;color:var(--muted);margin:2px 0 8px}
.suggest{font-size:13px;font-weight:700;margin:0 0 10px}
.suggest.up{color:var(--green)} .suggest.hold{color:var(--amber)} .suggest.beat{color:var(--muted)}
#timerbar{
  position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));
  background:var(--volt);color:var(--volt-ink);
  display:none;align-items:center;gap:14px;padding:12px 18px;z-index:40;font-weight:900;
}
#timerbar .t{font-size:36px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
#timerbar .lbl{text-transform:uppercase;letter-spacing:.1em;font-size:11px;opacity:.75}
#timerbar button{background:rgba(0,0,0,.16);color:inherit;padding:9px 13px;font-weight:800;font-size:13px}
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(10,11,13,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{flex:1;background:none;padding:12px 0 9px;color:var(--faint);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:4px}
#tabs button.on{color:var(--volt)}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea,input[type=text],input[type=number],input[type=date],select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  color:var(--text);font:inherit;padding:11px 13px;
}
textarea{font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}
.scale{display:flex;gap:7px}
.scale button{flex:1;background:var(--panel2);border:1px solid var(--line);padding:14px 0;font-weight:800}
.scale button.on{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.scale button.on.neg{background:var(--red);color:#fff;border-color:var(--red)}
.scale button.on.mid{background:var(--amber);color:#231a05;border-color:var(--amber)}
.q{margin-bottom:16px}
.q label{display:block;font-weight:800;font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
pre.csv{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;font-size:11px;line-height:1.5;max-height:170px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-top:none}
td.num,th.num{text-align:right}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--volt);color:var(--volt-ink);padding:11px 20px;border-radius:999px;
  font-weight:900;z-index:100;display:none;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:10px;color:var(--faint);font-weight:800;text-transform:uppercase}
.cal .day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--muted);background:var(--panel2);position:relative}
.cal .day.empty{background:transparent}
.cal .day.none{color:var(--faint)}
.cal .day.full{background:var(--volt);color:var(--volt-ink)}
.cal .day.part{background:#4a4415;color:var(--amber)}
.cal .day.future{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.cal .day.today{outline:2px solid var(--text)}
.cal .day .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:2px;background:currentColor}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.stat .v{font-size:27px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.stat .d{font-size:12px;font-weight:700;margin-top:1px}
.d.up{color:var(--red)} .d.down{color:var(--green)} .d.flat{color:var(--muted)}
.spark{width:100%;height:44px;margin-top:6px}
.spark polyline{fill:none;stroke:var(--volt);stroke-width:2}
.spark circle{fill:var(--volt)}
.tpl-ex{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.tpl-ex input,.tpl-ex select{padding:8px;font-size:13px}
.tpl-ex .n{flex:2.4} .tpl-ex .s{flex:.7} .tpl-ex .r{flex:1} .tpl-ex .l{flex:1} .tpl-ex .u{flex:.9}
.hero{padding:22px 0 6px}
.hero .date{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero .line2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<main id="view"></main>

<div id="timerbar">
  <div class="t num" id="timerText">2:00</div>
  <div class="lbl grow">Rest</div>
  <button onclick="Timer.add(30)">+30s</button>
  <button onclick="Timer.stop()">Done</button>
</div>

<nav id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>Home</button>
  <button data-tab="day"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Day</button>
  <button data-tab="review"><svg viewBox="0 0 24 24"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 12h8M8 16h5"/></svg>Review</button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/></svg>Data</button>
</nav>

<script>
"use strict";
/* ================= storage ================= */
const KEY="physique_v2"; const APP_VER="3.1";
const SESSION_KEYS=["pushHyp","pullHyp","legsHyp","pushHeavy","pullHeavy","legHeavy"];
const SESSION_NAMES={pushHyp:"Push Hypertrophy",pullHyp:"Pull Hypertrophy",legsHyp:"Legs Hypertrophy",pushHeavy:"Push Heavy",pullHeavy:"Pull Heavy",legHeavy:"Leg Heavy"};
let S;
function blankTemplates(){
  const t={};
  SESSION_KEYS.forEach(k=>t[k]={name:SESSION_NAMES[k],exercises:[],abs:"",cardio:""});
  return t;
}
function load(){
  try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
  if(!S) S={
    settings:{restSec:120,phase:"Phase 4",proteinTarget:"160-170 g",calT:"1750-1850 kcal",calR:"1600-1700 kcal",reviewDate:"",lastReview:""},
    templates:blankTemplates(), sessions:[], body:[], scans:[], nutrition:[], plans:[]
  };
  // migrations / defaults for newer versions
  if(S.settings.cardioLabel==null) S.settings.cardioLabel="Incline walk · incline 13 · speed 3";
  if(S.settings.cardioKcalMin==null) S.settings.cardioKcalMin=8;
  if(S.settings.lastBackup==null) S.settings.lastBackup="";
  save();
}
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); }
const today=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(msg,warn){ const t=document.getElementById("toast"); t.textContent=msg; t.style.background=warn?"var(--red)":"var(--volt)"; t.style.color=warn?"#fff":"var(--volt-ink)"; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",1900); }
const fmtNum=n=>String(Math.round(n*100)/100);
const addDays=(iso,n)=>{ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/86400000);

/* ================= timer ================= */
const Timer={ end:0,iv:null,
  start(sec){ this.end=Date.now()+sec*1000; document.getElementById("timerbar").style.display="flex"; clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),200); this.tick(); },
  add(s){ this.end+=s*1000; this.tick(); },
  stop(){ clearInterval(this.iv); document.getElementById("timerbar").style.display="none"; },
  tick(){ const left=Math.ceil((this.end-Date.now())/1000);
    if(left<=0){ this.stop(); this.buzz(); toast("Rest done — go!"); return; }
    document.getElementById("timerText").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0"); },
  buzz(){ if(navigator.vibrate) navigator.vibrate([200,100,200]);
    try{ const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
      o.connect(g); g.connect(c.destination); o.frequency.value=880;
      g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7);
      o.start(); o.stop(c.currentTime+.7); }catch(e){} }
};

/* ================= day status ================= */
function nutritionFor(date){ return S.nutrition.find(n=>n.date===date)||null; }
function sessionsOn(date){ return S.sessions.filter(s=>s.date===date); }
function dayState(date){
  const n=nutritionFor(date), hasN=n&&n.protein&&n.calories;
  const hasS=sessionsOn(date).length>0;
  const hasB=S.body.some(b=>b.date===date)||S.scans.some(b=>b.date===date);
  if(hasN) return "full";
  if(hasS||hasB||n) return "part";
  return "none";
}
function streak(){
  let d=today(), n=0;
  if(dayState(d)==="none") d=addDays(d,-1);
  while(dayState(d)!=="none"){ n++; d=addDays(d,-1); if(n>999)break; }
  return n;
}

/* ================= views ================= */
let tab="home", active=null, editKey=null, editId=null, reviewText="", planMsg="", logDate=today(), addSess=false, planOpen=false, reviseId=null, sessionMsg="", chart=null, chartRange=90, lastViewKey="";
const DRAFT="physique_v2_draft";
function persistDraft(){ try{ if(active) localStorage.setItem(DRAFT,JSON.stringify({active,editId,ts:Date.now(),timerEnd:Timer.end>Date.now()?Timer.end:0})); else localStorage.removeItem(DRAFT); }catch(e){} }
function restoreDraft(){ try{
  const d=JSON.parse(localStorage.getItem(DRAFT));
  if(d&&d.active&&Date.now()-(d.ts||0)<43200000){ active=d.active; editId=d.editId||null; tab="day"; logDate=d.active.date;
    if(d.timerEnd>Date.now()) Timer.start(Math.ceil((d.timerEnd-Date.now())/1000)); }
  else localStorage.removeItem(DRAFT);
}catch(e){} }
function render(){
  persistDraft();
  const y=window.scrollY;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const v=document.getElementById("view");
  if(tab==="home") v.innerHTML=viewHome();
  else if(tab==="day") v.innerHTML=active?viewSession():viewDay();
  else if(tab==="review") v.innerHTML=viewReview();
  else v.innerHTML=viewData();
  if(chart) v.insertAdjacentHTML("beforeend",chartOverlay());
  const key=tab+"|"+(active?active.id:"")+"|"+(chart||"")+"|"+logDate;
  if(key===lastViewKey) window.scrollTo(0,y); else window.scrollTo(0,0);
  lastViewKey=key;
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; logDate=today(); addSess=false; render(); });
window.pickDay=function(iso){ logDate=iso; addSess=false; tab="day"; render(); };
window.editSession=function(id){ const x=S.sessions.find(v=>v.id===id); if(!x)return;
  active=JSON.parse(JSON.stringify(x)); active.entries.forEach(e=>e.sets.forEach(st=>st.done=true));
  if(active.cardioMin==null)active.cardioMin=20; if(active.note==null)active.note="";
  editId=id; tab="day"; render(); };

/* ---------- HOME ---------- */
function spark(data,w,h){
  if(data.length<2) return `<div class="tiny muted">need more entries</div>`;
  const min=Math.min(...data), max=Math.max(...data), span=(max-min)||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1)*(w-6)+3).toFixed(1)},${(h-5-((v-min)/span)*(h-10)).toFixed(1)}`);
  const last=pts[pts.length-1].split(",");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts.join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="3"/></svg>`;
}
function calendarHTML(){
  const t=today(); const [Y,M]=t.split("-").map(Number);
  const first=new Date(Y,M-1,1); const nDays=new Date(Y,M,0).getDate();
  let off=(first.getDay()+6)%7; // monday start
  const wd=["M","T","W","T","F","S","S"].map(d=>`<div class="wd">${d}</div>`).join("");
  let cells="";
  for(let i=0;i<off;i++) cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=nDays;d++){
    const iso=Y+"-"+String(M).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const future=iso>t;
    const st=future?"future":dayState(iso);
    const onDay=sessionsOn(iso);
    const isRest=onDay.length&&onDay.every(x=>x.sessionKey==="rest");
    const trained=onDay.length>0;
    cells+=`<div class="day ${st}${iso===t?" today":""}" ${future?"":`onclick="pickDay('${iso}')" style="cursor:pointer"`}>${d}${isRest?'<div class="tiny" style="color:var(--muted);margin-top:1px">R</div>':(trained?'<div class="dot"></div>':"")}</div>`;
  }
  return `<div class="cal">${wd}${cells}</div>
  <div class="row tiny muted" style="margin-top:10px;gap:14px;flex-wrap:wrap">
    <span><span style="color:var(--volt)">■</span> logged</span>
    <span><span style="color:var(--amber)">■</span> partial</span>
    <span>• trained</span>
    <span>R rest day</span>
  </div>`;
}
function last7avg(arr,field){
  const x=[...arr].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).map(r=>r[field]).filter(v=>v!=null);
  return x.length?x.reduce((s,v)=>s+v,0)/x.length:null;
}
const toKg=(w,unit)=>unit==="lb"?w*0.4536:w;
function cardioMinutes(s){
  if(s.cardioDone===false) return 0;
  if(s.cardioMin) return s.cardioMin;
  const src=s.cardio||""; if(s.cardioDone===null&&!src) return 0;
  const m=src.match(/(\d+)\s*min/i); return m?+m[1]:0;
}
function strengthIndex(){
  // mean % change of top-set load per exercise: first logged vs latest (needs 2+ dated points)
  const first={}, last={};
  S.sessions.filter(s=>s.entries.length).forEach(s=>s.entries.forEach(e=>{
    if(!e.sets.length)return;
    const w=toKg(e.sets[0].w,e.unit);
    if(first[e.name]==null){ first[e.name]={w,date:s.date}; }
    last[e.name]={w,date:s.date};
  }));
  // trimmed mean: ratios outside 0.5-2.0 are machine/unit artifacts, not strength changes
  const ratios=Object.keys(first).filter(k=>last[k].date>first[k].date&&first[k].w>0)
    .map(k=>last[k].w/first[k].w).filter(r=>r>=0.5&&r<=2);
  if(!ratios.length) return null;
  return (ratios.reduce((a,b)=>a+b,0)/ratios.length-1)*100;
}
function weeklyTonnage(){
  // last 8 weeks total kg lifted (w×r, lb converted)
  const t=today(), weeks=[];
  for(let i=7;i>=0;i--){
    const end=addDays(t,-7*i), start=addDays(end,-6);
    let sum=0;
    S.sessions.forEach(s=>{ if(s.date>=start&&s.date<=end) s.entries.forEach(e=>e.sets.forEach(st=>sum+=toKg(st.w,e.unit)*st.r)); });
    weeks.push(Math.round(sum));
  }
  return weeks;
}
function adherenceWeeks(){
  const t=today(),out=[];
  for(let i=7;i>=0;i--){ const end=addDays(t,-7*i),start=addDays(end,-6);
    let g=0,a=0,n=0;
    S.nutrition.forEach(x=>{ if(x.date>=start&&x.date<=end&&x.protein&&x.calories){ n++;
      if(x.protein==="yes"&&x.calories==="yes")g++; else if(x.protein!=="no"&&x.calories!=="no")a++; } });
    out.push({g,a,n}); }
  return out;
}
function adhBars(w){
  const W=150,H=44,bw=W/w.length-4;
  const bars=w.map((x,i)=>{
    const gx=i*(W/w.length)+2;
    const gh=x.n?x.g/7*(H-8):0, ah=x.n?x.a/7*(H-8):0;
    return `<rect x="${gx}" y="${H-2-gh}" width="${bw}" height="${Math.max(gh,x.n?1:0)}" fill="var(--volt)"/>
      <rect x="${gx}" y="${H-2-gh-ah}" width="${bw}" height="${ah}" fill="var(--amber)" opacity=".8"/>

function lastSessionOf(key){ for(let i=S.sessions.length-1;i>=0;i--) if(S.sessions[i].sessionKey===key&&S.sessions[i].entries.length) return S.sessions[i]; return null; }
function lastEntryFor(key,name){ const s=lastSessionOf(key); return s?(s.entries.find(e=>e.name===name)||null):null; }
const repRange=ex=>ex.repLow===ex.repHigh?String(ex.repLow):ex.repLow+"–"+ex.repHigh;
const lastStr=l=>l?fmtNum(l.sets[0].w)+" × "+l.sets.map(s=>s.r).join(", "):"—";
function suggestion(ex,last){
  if(ex.hold) return {cls:"hold",text:"Coach: hold "+fmtNum(ex.load)+" "+ex.unit+" — build reps & control"};
  if(!last) return {cls:"beat",text:"Target "+ex.sets+"×"+repRange(ex)+" @ "+fmtNum(ex.load)+" "+ex.unit};
  const top=last.sets.length>=ex.sets&&last.sets.every(s=>s.r>=ex.repHigh)&&last.sets[0].w>=ex.load;
  if(top) return {cls:"up",text:"All sets at top reps — ready for "+fmtNum(last.sets[0].w+(ex.inc||2.5))+" "+ex.unit};
  return {cls:"beat",text:"Beat last reps at "+fmtNum(last.sets[0].w)+" "+ex.unit};
}
function lastDateOf(key){ for(let i=S.sessions.length-1;i>=0;i--) if(S.sessions[i].sessionKey===key) return S.sessions[i].date; return null; }
function sessionPicker(){
  const lastTrain=[...S.sessions].filter(s=>s.sessionKey!=="rest").pop();
  const nextKey=lastTrain&&SESSION_KEYS.includes(lastTrain.sessionKey)?SESSION_KEYS[(SESSION_KEYS.indexOf(lastTrain.sessionKey)+1)%6]:SESSION_KEYS[0];
  const cards=SESSION_KEYS.map(k=>{ const t=S.templates[k], last=lastDateOf(k), ls=lastSessionOf(k);
    const lifts=ls?ls.entries.slice(0,2).map(e=>`${e.name.split(" ").slice(0,2).join(" ")} ${fmtNum(e.sets[0].w)}`).join(" · "):"";
    return `<button class="sessbtn" ${k===nextKey?'style="border-color:var(--volt)"':""} onclick="startSession('${k}')"><b>${esc(t.name)}${k===nextKey?' <span style="color:var(--volt)">›</span>':""}</b><span>${t.exercises.length?("last "+(last||"never")+(lifts?" · "+esc(lifts):"")):"empty — set up plan"}</span></button>`; }).join("");
  const banner=lastTrain?`<div class="card row"><div class="grow small"><span class="muted">Last: </span><b>${esc(lastTrain.name)}</b> <span class="muted">· ${esc(lastTrain.date)}</span><br><span class="muted">Up next: </span><b style="color:var(--volt)">${esc(SESSION_NAMES[nextKey])}</b></div></div>`:"";
  return banner+`<div class="sessgrid">${cards}</div>

}

window.bump=function(ei,si,f,dir){
  const en=active.entries[ei];
  const tpl=S.templates[active.sessionKey].exercises.find(e=>e.name===en.name);
  const inc=f==="w"?((tpl&&tpl.inc)||2.5):1;
  const st=en.sets[si]; st[f]=Math.max(0,Math.round((st[f]+dir*inc)*100)/100); render();
};

window.cardioBump=function(d){ const n=document.getElementById("sessNote"); if(n)active.note=n.value; active.cardioMin=Math.max(0,active.cardioMin+d); render(); };

window.finishSession=function(){

window.saveSession=function(){
  logDate=active.date;
  active.entries=active.entries.map(e=>({name:e.name,unit:e.unit,perSide:e.perSide,
    sets:(e.sets.some(s=>s.done)?e.sets.filter(s=>s.done):e.sets).map(s=>({w:s.w,r:s.r}))}));
  if(editId){ const i=S.sessions.findIndex(x=>x.id===editId); if(i>=0)S.sessions[i]=active; else S.sessions.push(active); }
  else S.sessions.push(active);
  S.sessions.sort((a,b)=>a.date.localeCompare(b.date));
  const tpl=S.templates[active.sessionKey];
  if(tpl) active.entries.forEach(en=>{ const ex=tpl.exercises.find(e=>e.name===en.name); if(ex&&en.sets.length)ex.load=en.sets[0].w; });
  save(); active=null; editId=null; Timer.stop(); toast("Session saved"); render();
};

function windowStart(){ return S.settings.lastReview||addDays(today(),-28); }
function pct(n,d){ return d?Math.round(n/d*100)+"%":"UNKNOWN"; }
function generateReview(){
  const t=today(), from=windowStart();
  const inWin=x=>x.date>from&&x.date<=t;
  const body=S.body.filter(inWin).sort((a,b)=>a.date.localeCompare(b.date));
  const scans=S.scans.filter(inWin).sort((a,b)=>a.date.localeCompare(b.date));
  const prevScan=[...S.scans].filter(x=>x.date<=from).sort((a,b)=>a.date.localeCompare(b.date)).pop();
  const sess=S.sessions.filter(inWin).sort((a,b)=>a.date.localeCompare(b.date));
  const nutri=S.nutrition.filter(x=>inWin(x)&&x.protein&&x.calories);
  const totalDays=daysBetween(from,t);
  const wEntries=body.filter(b=>b.weight!=null);
  const ws=wEntries.map(b=>b.weight), gs=body.map(b=>b.waist).filter(v=>v!=null);
  const avg=a=>a.length?(a.reduce((s,v)=>s+v,0)/a.length):null;
  const cnt=(a,f,v)=>a.filter(x=>x[f]===v).length;
  // progression events
  const prog=[];
  const seen={};
  // compare in kg so a kg->lb unit change never reads as a load jump; require same unit for the display
  sess.forEach(s=>s.entries.forEach(e=>{
    const k=s.sessionKey+"|"+e.name, w=e.sets[0]?e.sets[0].w:null;
    if(w==null)return;
    const kg=toKg(w,e.unit);
    if(seen[k]&&e.unit===seen[k].unit&&kg>seen[k].kg)
      prog.push(`${s.date}: ${e.name} ${fmtNum(seen[k].w)} -> ${fmtNum(w)} ${e.unit}`);
    if(!seen[k]){
      const before=[...S.sessions].filter(x=>x.sessionKey===s.sessionKey&&x.date<=from).pop();
      const pe=before?before.entries.find(x=>x.name===e.name):null;
      if(pe&&pe.sets[0]&&pe.unit===e.unit&&kg>toKg(pe.sets[0].w,pe.unit))
        prog.push(`${s.date}: ${e.name} ${fmtNum(pe.sets[0].w)} -> ${fmtNum(w)} ${e.unit}`);
    }
    seen[k]={kg,w,unit:e.unit};
  }));
  const dailySleep=S.nutrition.filter(x=>inWin(x)&&x.sleepH!=null).map(x=>x.sleepH);
  const sleepA=avg(dailySleep.length?dailySleep:sess.map(s=>s.checkin&&s.checkin.sleepH).filter(v=>v!=null));
  const energyA=avg(sess.map(s=>s.checkin&&s.checkin.energy).filter(v=>v));
  const train=sess.filter(s=>s.sessionKey!=="rest"), restDays=sess.length-train.length;
  const absDone=train.filter(s=>s.absDone===true).length, cardioDone=train.filter(s=>s.cardioDone===true).length;
  const cardioTot=sess.reduce((sum,s)=>sum+cardioMinutes(s),0);
  const dayNotes=S.nutrition.filter(x=>inWin(x)&&x.note).map(x=>x.date+": "+x.note);
  const L=[];
  L.push("# COACH REVIEW PACKAGE");
  L.push("");
  L.push("Data Pulled Date: "+t);
  L.push("Data Coverage Window: "+from+" to "+t+" ("+totalDays+" days)");
  L.push("Phase: "+S.settings.phase);
  L.push("Targets: protein "+S.settings.proteinTarget+" · training "+S.settings.calT+" · rest "+S.settings.calR);
  L.push("");
  L.push("## OBJECTIVE FACTS");
  L.push("");
  L.push("Weight: "+(ws.length?ws.length+" entries · avg "+avg(ws).toFixed(2)+" kg · range "+Math.min(...ws).toFixed(1)+"-"+Math.max(...ws).toFixed(1)+" · latest "+ws[ws.length-1].toFixed(1)+" kg ("+wEntries[wEntries.length-1].date+")":"UNKNOWN — no entries"));
  L.push("Waist: "+(gs.length?gs.length+" entries · avg "+avg(gs).toFixed(2)+" cm · range "+Math.min(...gs).toFixed(1)+"-"+Math.max(...gs).toFixed(1)+" · latest "+gs[gs.length-1].toFixed(1)+" cm":"UNKNOWN — no entries"));
  if(scans.length){ scans.forEach(s=>L.push("Body scan "+s.date+": "+s.weight+" kg · "+s.muscle+" kg muscle · "+s.fat+"% fat ("+(s.device||"Accuniq")+")"));
    if(prevScan) L.push("Previous scan "+prevScan.date+": "+prevScan.weight+" kg · "+prevScan.muscle+" kg muscle · "+prevScan.fat+"% fat");
  } else L.push("Body scans: none in window"+(prevScan?" (last: "+prevScan.date+", "+prevScan.fat+"% fat)":""));
  L.push("");
  L.push("Training: "+train.length+" sessions in "+totalDays+" days"+(restDays?" · "+restDays+" logged rest days":""));
  const byType={}; train.forEach(s=>byType[s.name]=(byType[s.name]||0)+1);
  Object.entries(byType).forEach(([n,c])=>L.push("- "+n+": "+c));
  L.push("Abs done: "+absDone+"/"+train.length+" · Cardio done: "+cardioDone+"/"+train.length);
  L.push("Cardio volume: "+cardioTot+" min total (~"+Math.round(cardioTot*(S.settings.cardioKcalMin||8))+" kcal at "+(S.settings.cardioKcalMin||8)+" kcal/min) · mode: "+S.settings.cardioLabel);
  L.push("");
  L.push("Progression events:");
  if(prog.length) prog.forEach(p=>L.push("- "+p)); else L.push("- none detected");
  L.push("");
  L.push("## NUTRITION ADHERENCE (self-reported daily)");
  L.push("");
  L.push("Days answered: "+nutri.length+"/"+totalDays);
  if(nutri.length){
    L.push("Protein target: hit "+pct(cnt(nutri,"protein","yes"),nutri.length)+" · close "+pct(cnt(nutri,"protein","close"),nutri.length)+" · missed "+pct(cnt(nutri,"protein","no"),nutri.length));
    L.push("Calories on plan: on "+pct(cnt(nutri,"calories","yes"),nutri.length)+" · close "+pct(cnt(nutri,"calories","close"),nutri.length)+" · off "+pct(cnt(nutri,"calories","no"),nutri.length));
    const reds=nutri.filter(n=>n.protein==="no"||n.calories==="no").map(n=>n.date);
    L.push("Off-plan days: "+(reds.length?reds.join(", "):"none"));
  } else L.push("UNKNOWN — no daily answers recorded");
  L.push("");
  L.push("## RECOVERY");
  L.push("");
  L.push("Avg sleep: "+(sleepA?sleepA.toFixed(1)+" h ("+(dailySleep.length||sess.filter(s=>s.checkin).length)+" nights)":"UNKNOWN"));
  L.push("Avg energy: "+(energyA?energyA.toFixed(1)+"/5":"UNKNOWN"));
  const notes=sess.filter(s=>(s.checkin&&s.checkin.notes)||s.note).map(s=>s.date+": "+[s.note,s.checkin&&s.checkin.notes].filter(Boolean).join(" · "));
  if(notes.length){ L.push("Session notes:"); notes.forEach(n=>L.push("- "+n)); }
  if(dayNotes.length){ L.push("Day notes:"); dayNotes.forEach(n=>L.push("- "+n)); }
  L.push("");
  L.push("## UNKNOWNS / LIMITATIONS");
  L.push("");
  if(!ws.length) L.push("- No weight entries this window");
  if(ws.length&&ws.length<totalDays/3) L.push("- Sparse weigh-ins ("+ws.length+"/"+totalDays+" days)");
  if(nutri.length<totalDays*0.7) L.push("- Nutrition adherence answered on only "+nutri.length+"/"+totalDays+" days");
  L.push("- Calories/macros are adherence flags, not measured values");
  L.push("- Cardio kcal is an estimate ("+(S.settings.cardioKcalMin||8)+" kcal/min assumption)");
  L.push("- Steps: not tracked");
  L.push("");
  L.push("## INSTRUCTIONS FOR COACH (ChatGPT)");
  L.push("");
  L.push("You are my evidence-based physique coach. Review the data above. Separate facts from interpretation. Do not invent numbers. Where data is UNKNOWN, say so. Then reply with next block's plan using EXACTLY this format (plain text, no markdown fences):");
  L.push("");
  L.push(planFormatSpec());
  return L.join("\n");
}
function planFormatSpec(){
  return [
"PHYSIQUE PLAN",
"phase: <phase name>",
"review_date: <YYYY-MM-DD next review>",
"protein: <target, e.g. 160-170 g>",
"calories_training: <e.g. 1750-1850 kcal>",
"calories_rest: <e.g. 1600-1700 kcal>",
"",
"[Push Heavy]",
"Barbell Bench Press | 4x5-6 | 45 kg",
"<exercise> | <sets>x<reps or low-high> | <load> <kg|lb> | <optional flags: hold, per-side, inc=1.25>",
"abs: <abs plan>",
"cardio: <cardio plan>",
"",
"(repeat one [Session Name] block for each of my 6 sessions: Push Heavy, Pull Heavy, Leg Heavy, Push Hypertrophy, Pull Hypertrophy, Legs Hypertrophy — keep exercises unchanged unless you deliberately change them)"].join("\n");

function keyForName(n){
  const x=n.toLowerCase();
  const found=SESSION_KEYS.find(k=>SESSION_NAMES[k].toLowerCase()===x);
  if(found) return found;
  if(/push/.test(x)) return /hyp/.test(x)?"pushHyp":"pushHeavy";
  if(/pull/.test(x)) return /hyp/.test(x)?"pullHyp":"pullHeavy";
  if(/leg/.test(x)) return /hyp/.test(x)?"legsHyp":"legHeavy";
  return null;
}
function parseSessionBlocks(text){
  const lines=text.split(/\r?\n/);
  const plan={settings:{},sessions:{}};
  let cur=null;
  for(let raw of lines){
    const line=raw.trim();
    if(!line||/^PHYSIQUE PLAN/i.test(line)||/^SESSION UPDATE$/i.test(line))continue;
    const mH=line.match(/^\[(.+)\]$/);
    if(mH){ const k=keyForName(mH[1].trim()); if(k){ cur=k; plan.sessions[k]={name:SESSION_NAMES[k],exercises:[],abs:"",cardio:""}; } else cur=null; continue; }
    const mKV=line.match(/^(phase|review_date|protein|calories_training|calories_rest)\s*:\s*(.+)$/i);
    if(mKV&&!cur){ plan.settings[mKV[1].toLowerCase()]=mKV[2].trim(); continue; }
    if(cur){
      const mAbs=line.match(/^abs\s*:\s*(.+)$/i); if(mAbs){ plan.sessions[cur].abs=mAbs[1].trim(); continue; }
      const mCar=line.match(/^cardio\s*:\s*(.+)$/i); if(mCar){ plan.sessions[cur].cardio=mCar[1].trim(); continue; }
      if(line.includes("|")){
        const parts=line.split("|").map(p=>p.trim());
        const name=parts[0].replace(/^-\s*/,"");
        const mSR=(parts[1]||"").match(/(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?/i);
        const mL=(parts[2]||"").match(/([\d.]+)\s*(kg|lb)?/i);
        if(!name||!mSR||!mL) return {err:"Bad exercise line: "+line};
        const ex={name,sets:+mSR[1],repLow:+mSR[2],repHigh:mSR[3]?+mSR[3]:+mSR[2],load:parseFloat(mL[1]),unit:(mL[2]||"kg").toLowerCase(),perSide:false,hold:false,inc:2.5};
        const flags=(parts[3]||"").toLowerCase();
        if(/hold/.test(flags))ex.hold=true;
        if(/per[- ]?side/.test(flags))ex.perSide=true;
        const mI=flags.match(/inc\s*=\s*([\d.]+)/); if(mI)ex.inc=parseFloat(mI[1]);
        plan.sessions[cur].exercises.push(ex);
      }
    }
  }
  return plan;
}
function parsePlan(text){
  if(!/PHYSIQUE PLAN/i.test(text)) return {err:"Missing 'PHYSIQUE PLAN' header"};
  const plan=parseSessionBlocks(text);
  if(!Object.keys(plan.sessions).length) return {err:"No [Session] blocks found"};
  return {plan};
}
function parseSessionUpdate(text){
  if(!/SESSION UPDATE/i.test(text)) return {err:"Missing 'SESSION UPDATE' header"};
  const plan=parseSessionBlocks(text);
  if(!Object.keys(plan.sessions).length) return {err:"No [Session] block found"};
  return {plan};
}

function chartSeries(m){
  const body=[...S.body].sort((a,b)=>a.date.localeCompare(b.date));
  const scans=[...S.scans].sort((a,b)=>a.date.localeCompare(b.date));
  if(m==="weight")return{label:"Weight kg",pts:body.filter(b=>b.weight!=null).map(b=>({d:b.date,v:b.weight}))};
  if(m==="waist")return{label:"Waist cm",pts:body.filter(b=>b.waist!=null).map(b=>({d:b.date,v:b.waist}))};
  if(m==="fat")return{label:"Body fat %",pts:scans.map(x=>({d:x.date,v:x.fat}))};
  if(m==="sleep")return{label:"Sleep h",pts:[...S.nutrition].filter(n=>n.sleepH!=null).sort((a,b)=>a.date.localeCompare(b.date)).map(n=>({d:n.date,v:n.sleepH}))};
  if(m.startsWith("lift:")){ const name=m.slice(5); let unit="kg"; const pts=[];

  else{
    const W=Math.max(340,pts.length*14),H=210,P=26;
    const vs=pts.map(p=>p.v),min=Math.min(...vs),max=Math.max(...vs),span=(max-min)||1;

    const poly=xy.map(c=>c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
    const lp=xy[xy.length-1];
    inner=`<div id="chartScroll" style="overflow-x:auto;-webkit-overflow-scrolling:touch"><svg width="${W}" height="${H}">
      <polyline points="${poly}" fill="none" stroke="var(--volt)" stroke-width="2"/>
      ${xy.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="2.5" fill="var(--volt)" opacity=".55"/>`).join("")}
      <circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="var(--volt)"/>
      <text x="${P}" y="15" fill="var(--muted)" font-size="11">max ${max}</text>
      <text x="${P}" y="${H-8}" fill="var(--muted)" font-size="11">min ${min} · ${pts[0].d} → ${pts[pts.length-1].d} · ${pts.length} pts</text>
    </svg></div>`;
  }
  return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:70;display:flex;align-items:center;justify-content:center;padding:14px" onclick="chart=null;render()">
    <div class="card" style="width:100%;max-width:520px;margin:0" onclick="event.stopPropagation()">
      <div class="row"><b class="grow" style="text-transform:uppercase;letter-spacing:.05em">${se.label}</b><b class="num" style="color:var(--volt);font-size:20px">${pts.length?pts[pts.length-1].v:"—"}</b></div>
      <div class="scale" style="margin:12px 0">${[[30,"1M"],[90,"3M"],[180,"6M"],[0,"All"]].map(x=>`<button class="${chartRange===x[0]?"on":""}" onclick="setChartRange(${x[0]})">${x[1]}</button>`).join("")}</div>
      ${inner}
      <button class="btn btn-ghost" style="margin-top:12px" onclick="chart=null;render()">Close</button>
    </div></div>`;
}
/* ---------- DATA ---------- */
function csvEsc(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCsv(rows){ return rows.map(r=>r.map(csvEsc).join(",")).join("\n"); }
function buildCSVs(){
  const ph=S.settings.phase;
  const files={};
  files["weight_waist_log.csv"]=toCsv([["date","weight_kg","waist_cm","source_period","phase","notes"],
    ...[...S.body].sort((a,b)=>a.date.localeCompare(b.date)).map(b=>[b.date,b.weight,b.waist==null?"":b.waist,"",ph,""])]);
  files["body_scan_log.csv"]=toCsv([["date","weight_kg","muscle_kg","body_fat_percent","device","phase","notes"],
    ...[...S.scans].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>[s.date,s.weight,s.muscle,s.fat,s.device||"Accuniq",ph,""])]);
  files["training_log.csv"]=toCsv([["date","phase","session_label","cardio","abs","notes"],
    ...S.sessions.map(s=>[s.date,ph,s.name,
      s.cardioDone===true?((s.cardioMin?S.settings.cardioLabel+" "+s.cardioMin+" min":s.cardio)):(s.cardioDone===false?"Skipped":""),
      s.absDone===true?s.abs:(s.absDone===false?"Skipped":""),
      [s.note,s.checkin&&s.checkin.notes].filter(Boolean).join(" · ")])]);
  files["exercise_log.csv"]=toCsv([["date","phase","session_label","exercise","set_number","reps","load","unit","per_side","notes"],
    ...S.sessions.flatMap(s=>s.entries.flatMap(e=>e.sets.map((st,i)=>[s.date,ph,s.name,e.name,i+1,st.r,st.w,e.unit,e.perSide?"yes":"",""])))]);
  files["checkin_log.csv"]=toCsv([["date","session_label","sleep_hours","sleep_quality_1to5","energy_1to5","notes"],
    ...S.sessions.filter(s=>s.checkin).map(s=>[s.date,s.name,s.checkin.sleepH,s.checkin.sleepQ||"",s.checkin.energy||"",s.checkin.notes||""])]);
  files["nutrition_log.csv"]=toCsv([["date","protein_target","calories_on_plan","sleep_hours","note"],
    ...[...S.nutrition].filter(n=>n.protein||n.calories||n.sleepH!=null||n.note).sort((a,b)=>a.date.localeCompare(b.date)).map(n=>[n.date,n.protein||"",n.calories||"",n.sleepH!=null?n.sleepH:"",n.note||""])]);
  return files;
}
function parseCSV(text){
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"')q=true;
    else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cell);cell=""; if(row.some(x=>x!==""))rows.push(row); row=[]; }
    else cell+=c; }
  row.push(cell); if(row.some(x=>x!==""))rows.push(row);
  return rows;
}
function importText(text){
  let counts={body:0,scans:0,sessions:0,nutrition:0,checkins:0,plan:false};
  // plan block?
  if(/PHYSIQUE PLAN/i.test(text)){
    const seg=text.split(/=====[^=\n]*=====/)[0];
    const r=parsePlan(text);
    if(r.plan){ const p=r.plan, st=p.settings;
      if(st.phase)S.settings.phase=st.phase; if(st.review_date)S.settings.reviewDate=st.review_date;
      if(st.protein)S.settings.proteinTarget=st.protein; if(st.calories_training)S.settings.calT=st.calories_training; if(st.calories_rest)S.settings.calR=st.calories_rest;
      Object.entries(p.sessions).forEach(([k,v])=>{ if(v.exercises.length)S.templates[k]=v; });
      S.plans.push({date:today(),phase:S.settings.phase,raw:"imported"});
      counts.plan=true; }
  }
  // split ===== sections or treat whole as one csv
  const sections=text.split(/=====\s*([^=\n]+?)\s*=====/);
  const blobs=[];
  if(sections.length>1){ for(let i=1;i<sections.length;i+=2) blobs.push(sections[i+1]||""); }
  else blobs.push(text);
  blobs.forEach(blob=>{
    const rows=parseCSV(blob.trim());
    if(rows.length<2)return;
    const h=rows[0].map(x=>x.trim().toLowerCase());
    const idx=n=>h.indexOf(n);
    if(h.includes("waist_cm")&&h.includes("weight_kg")){
      rows.slice(1).forEach(r=>{ const d=r[idx("date")],w=parseFloat(r[idx("weight_kg")]),g=parseFloat(r[idx("waist_cm")]);
        if(!d||isNaN(w))return; if(!S.body.some(b=>b.date===d)){ S.body.push({date:d,weight:w,waist:isNaN(g)?null:g}); counts.body++; } });
    } else if(h.includes("muscle_kg")){
      rows.slice(1).forEach(r=>{ const d=r[idx("date")]; if(!d)return;
        if(!S.scans.some(s=>s.date===d)){ S.scans.push({date:d,weight:parseFloat(r[idx("weight_kg")]),muscle:parseFloat(r[idx("muscle_kg")]),fat:parseFloat(r[idx("body_fat_percent")]),device:r[idx("device")]||"Accuniq"}); counts.scans++; } });
    } else if(h.includes("exercise")&&h.includes("set_number")){
      const groups={};
      rows.slice(1).forEach(r=>{ const d=r[idx("date")],lbl=r[idx("session_label")];
        const gk=d+"|"+lbl; groups[gk]=groups[gk]||{date:d,label:lbl,ex:{}};
        const en=r[idx("exercise")];
        groups[gk].ex[en]=groups[gk].ex[en]||{name:en,unit:r[idx("unit")]||"kg",perSide:r[idx("per_side")]==="yes",sets:[]};
        groups[gk].ex[en].sets.push({w:parseFloat(r[idx("load")]),r:parseInt(r[idx("reps")])}); });
      Object.values(groups).forEach(g=>{
        if(S.sessions.some(s=>s.date===g.date&&s.name===g.label))return;
        const key=keyForName(g.label)||"pushHyp";
        S.sessions.push({id:"imp"+g.date+g.label,date:g.date,sessionKey:key,name:g.label,entries:Object.values(g.ex),cardio:"",cardioDone:null,abs:"",absDone:null,checkin:null});
        counts.sessions++; });
    } else if(h.includes("session_label")&&h.includes("cardio")){
      rows.slice(1).forEach(r=>{ const d=r[idx("date")],lbl=r[idx("session_label")];
        if(!d||S.sessions.some(s=>s.date===d&&s.name===lbl))return;
        const key=keyForName(lbl)||"pushHyp";
        const car=r[idx("cardio")]||"", abs=r[idx("abs")]||"";
        S.sessions.push({id:"imp"+d+lbl,date:d,sessionKey:key,name:lbl,entries:[],
          cardio:car,cardioDone:car&&!/skip/i.test(car)?true:(car?false:null),
          abs:abs,absDone:abs&&!/skip/i.test(abs)?true:(abs?false:null),checkin:null});
        counts.sessions++; });
    } else if(h.includes("sleep_hours")&&!h.includes("protein_target")){
      rows.slice(1).forEach(r=>{ const d=r[idx("date")],lbl=idx("session_label")>=0?r[idx("session_label")]:"";
        const s=S.sessions.find(x=>x.date===d&&(!lbl||x.name===lbl));
        if(s&&!s.checkin){ s.checkin={sleepH:parseFloat(r[idx("sleep_hours")])||null,sleepQ:parseInt(r[idx("sleep_quality_1to5")])||0,energy:parseInt(r[idx("energy_1to5")])||0,notes:idx("notes")>=0?r[idx("notes")]:""}; counts.checkins++; } });
    } else if(h.includes("protein_target")){
      rows.slice(1).forEach(r=>{ const d=r[idx("date")]; if(!d)return;
        if(!S.nutrition.some(n=>n.date===d)){
          const rec={date:d,protein:r[idx("protein_target")],calories:r[idx("calories_on_plan")]};
          if(idx("sleep_hours")>=0&&r[idx("sleep_hours")]!=="")rec.sleepH=parseFloat(r[idx("sleep_hours")]);
          if(idx("note")>=0&&r[idx("note")])rec.note=r[idx("note")];
          S.nutrition.push(rec); counts.nutrition++; } });
    }
  });
  S.sessions.sort((a,b)=>a.date.localeCompare(b.date));
  save();
  return counts;
}
window.doImport=function(){
  const txt=document.getElementById("importPaste").value;
  if(!txt.trim()){ toast("Nothing to import",true); return; }
  const c=importText(txt);
  toast("Imported ✓");
  planMsg="";
  document.getElementById("importPaste").value="";
  alert("Imported:\n"+(c.plan?"- plan applied\n":"")+"- "+c.body+" body entries\n- "+c.scans+" scans\n- "+c.sessions+" sessions\n- "+c.checkins+" check-ins\n- "+c.nutrition+" nutrition days");
  render();
};
window.copyCsv=function(name){
  const files=buildCSVs();
  navigator.clipboard.writeText(files[name]).then(()=>toast("Copied "+name)).catch(()=>toast("Copy failed",true));
};
window.shareAll=function(){
  const files=buildCSVs();
  const txt=Object.entries(files).map(([n,c])=>"===== "+n+" =====\n"+c).join("\n\n");
  S.settings.lastBackup=today(); save();
  if(navigator.share)navigator.share({title:"Physique logs "+today(),text:txt}).catch(()=>{});
  else navigator.clipboard.writeText(txt).then(()=>toast("Copied all"));
};
window.backupAll=function(){
  S.settings.lastBackup=today(); save();
  navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Full backup copied — save it in Notes"));
};
window.restoreBackup=function(){
  const txt=prompt("Paste full backup JSON:");
  if(!txt)return;
  try{ const j=JSON.parse(txt); if(!j.settings||!j.templates)throw 0; S=j; save(); toast("Restored"); render(); }
  catch(e){ toast("Invalid backup",true); }
};
function viewData(){
  const files=buildCSVs();
  const blocks=Object.entries(files).map(([name,csv])=>`
    <div style="margin-bottom:14px"><div class="row" style="margin-bottom:6px"><b class="grow small">${esc(name)}</b>
      <button class="btn btn-ghost btn-sm" onclick="copyCsv('${name}')">Copy</button></div>
      <pre class="csv">${esc(csv.split("\n").slice(0,6).join("\n"))}${csv.split("\n").length>6?"\n…":""}</pre></div>`).join("");
  let editor="";
  if(editKey){
    const t=S.templates[editKey];
    editor=`<h2>Edit ${esc(t.name)}</h2><div class="card">
      ${t.exercises.map((e,i)=>`
      <div class="tpl-ex">
        <input class="n" value="${esc(e.name)}" onchange="tplSet(${i},'name',this.value)">
        <input class="s" type="number" value="${e.sets}" onchange="tplSet(${i},'sets',this.value)">
        <input class="r" value="${e.repLow===e.repHigh?e.repLow:e.repLow+"-"+e.repHigh}" onchange="tplSet(${i},'reps',this.value)">
        <input class="l" type="number" step="0.5" value="${e.load}" onchange="tplSet(${i},'load',this.value)">
        <select class="u" onchange="tplSet(${i},'unit',this.value)"><option ${e.unit==="kg"?"selected":""}>kg</option><option ${e.unit==="lb"?"selected":""}>lb</option></select>
        <button class="btn-ghost btn-sm" style="border:1px solid var(--line)" onclick="tplDel(${i})">✕</button>
      </div>
      <div class="tiny muted" style="margin:-2px 0 8px 2px">
        <label><input type="checkbox" ${e.hold?"checked":""} onchange="tplSet(${i},'hold',this.checked)"> hold</label>
        &nbsp;<label><input type="checkbox" ${e.perSide?"checked":""} onchange="tplSet(${i},'perSide',this.checked)"> per side</label>
      </div>`).join("")}
      <button class="btn btn-ghost btn-sm" onclick="tplAdd()">+ Add exercise</button>
      <div class="q" style="margin-top:12px"><label>Abs</label><input type="text" value="${esc(t.abs)}" onchange="S.templates['${editKey}'].abs=this.value;save()"></div>
      <div class="q"><label>Cardio</label><input type="text" value="${esc(t.cardio)}" onchange="S.templates['${editKey}'].cardio=this.value;save()"></div>
      <button class="btn btn-volt" onclick="editKey=null;render()">Done</button></div>`;
  }
  return `<h1>Data</h1>
  <h2>Export</h2>
  <button class="btn btn-volt" onclick="shareAll()">Share all logs as one text</button>
  <div style="height:12px"></div>${blocks}
  <h2>Import</h2>
  <div class="card">
    <div class="small muted" style="margin-bottom:10px">Paste your starter file, folder CSVs, or an export bundle. Detects format automatically. Duplicates skipped.</div>
    <textarea id="importPaste" rows="5" placeholder="PHYSIQUE PLAN … or ===== weight_waist_log.csv ====="></textarea>
    <div style="height:10px"></div><button class="btn btn-volt" onclick="doImport()">Import</button>
  </div>
  <h2>Templates</h2>
  ${SESSION_KEYS.map(k=>`<button class="btn" style="margin-bottom:6px;text-align:left" onclick="editKey='${k}';render()">${esc(S.templates[k].name)} <span class="muted small">· ${S.templates[k].exercises.length} exercises</span></button>`).join("")}
  ${editor}
  <h2>Rest timer</h2>
  <div class="card"><div class="scale">${[90,120,150,180].map(x=>`<button class="${S.settings.restSec===x?"on":""}" onclick="setRest(${x})">${x}s</button>`).join("")}</div></div>
  <h2>Cardio settings</h2>
  <div class="card">
    <div class="q"><label>Cardio mode label</label><input type="text" value="${esc(S.settings.cardioLabel)}" onchange="S.settings.cardioLabel=this.value;save();toast('Saved')"></div>
    <div class="q" style="margin-bottom:0"><label>Estimated kcal per minute</label>
      <div class="stepper" style="max-width:220px"><button onclick="S.settings.cardioKcalMin=Math.max(1,S.settings.cardioKcalMin-0.5);save();render()">−</button><div class="val num grow">${S.settings.cardioKcalMin}</div><button onclick="S.settings.cardioKcalMin+=0.5;save();render()">+</button></div>
      <div class="tiny muted" style="margin-top:6px">~8 kcal/min ≈ incline walk, 13% incline, speed 3, ~67 kg body weight. Rough estimate only.</div></div>
  </div>
  <h2>Backup</h2>
  <div class="row"><button class="btn btn-ghost grow" onclick="backupAll()">Copy full backup</button>
  <button class="btn btn-ghost grow" onclick="restoreBackup()">Restore</button></div>
  <div style="height:10px"></div>
  <button class="btn btn-ghost" style="color:var(--red)" onclick="if(confirm('Erase ALL data on this phone?')){localStorage.removeItem(KEY);load();render();}">Reset everything</button>
  <div class="tiny muted" style="margin:10px 2px 0">PHYSIQUE v${APP_VER} · data lives on this device only · export regularly to your project folder.</div>`;
}
window.tplSet=function(i,f,v){
  const e=S.templates[editKey].exercises[i];
  if(f==="reps"){ const m=String(v).match(/(\d+)\s*[-–]?\s*(\d+)?/); if(m){e.repLow=+m[1];e.repHigh=m[2]?+m[2]:+m[1];} }
  else if(f==="sets")e.sets=Math.max(1,parseInt(v)||1);
  else if(f==="load")e.load=parseFloat(v)||0;
  else e[f]=v;
  save();
};
window.tplDel=function(i){ S.templates[editKey].exercises.splice(i,1); save(); render(); };
window.tplAdd=function(){ S.templates[editKey].exercises.push({name:"New Exercise",sets:3,repLow:10,repHigh:12,load:10,unit:"kg",perSide:false,hold:false,inc:2.5}); save(); render(); };

/* ================= boot ================= */
load(); restoreDraft(); render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
